<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IB Interview Reels - Video Explainers</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: #0a0a15; color: #fff; min-height: 100vh; overflow: hidden; }
.app { display: flex; height: 100vh; }

/* Sidebar */
.sidebar { width: 320px; background: #111125; border-right: 1px solid #222; overflow-y: auto; flex-shrink: 0; }
.sidebar-header { padding: 20px; border-bottom: 1px solid #222; }
.sidebar-header h2 { font-size: 18px; margin-bottom: 4px; }
.sidebar-header p { font-size: 12px; color: #666; }
.back-link { display: block; padding: 15px 20px; color: #007bff; text-decoration: none; font-size: 13px; border-bottom: 1px solid #222; }
.back-link:hover { background: #1a1a30; }
.sidebar-item { padding: 14px 20px; cursor: pointer; border-bottom: 1px solid #1a1a2e; transition: all 0.2s; display: flex; align-items: center; gap: 12px; }
.sidebar-item:hover { background: #1a1a30; }
.sidebar-item.active { background: #1a1a3a; border-left: 3px solid var(--c); }
.si-num { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; background: rgba(255,255,255,0.05); flex-shrink: 0; }
.sidebar-item.active .si-num { background: var(--c); color: #000; }
.si-text { flex: 1; }
.si-section { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #555; }
.si-title { font-size: 14px; margin-top: 2px; }
.si-playing { display: none; color: #00c9a7; font-size: 11px; margin-top: 2px; }
.sidebar-item.playing .si-playing { display: block; }

/* Viewer */
.viewer { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; background: radial-gradient(ellipse at center, #12122a 0%, #0a0a15 70%); }

/* Phone */
.phone { width: 400px; height: 720px; background: #0d0d1a; border-radius: 44px; border: 3px solid #2a2a3a; overflow: hidden; position: relative; box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05); }

/* Top progress */
.vid-progress { height: 3px; background: #222; position: absolute; top: 0; left: 0; right: 0; z-index: 20; }
.vid-progress-fill { height: 100%; background: linear-gradient(90deg, #007bff, #00c9a7); width: 0%; transition: width 0.2s linear; }

/* Screen */
.screen { height: 100%; display: flex; flex-direction: column; padding: 45px 28px 95px; position: relative; overflow: hidden; }

/* Canvas */
.draw-area canvas { width: 100%; height: 180px; border-radius: 12px; display: block; margin-bottom: 12px; }

.vid-section { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px; }
.vid-title { font-size: 22px; font-weight: 800; line-height: 1.2; margin-bottom: 12px; }

/* Subtitles */
.subtitle-area { flex: 1; overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; }
.subtitle-area::-webkit-scrollbar { display: none; }

.sub-chunk {
  font-size: 15px;
  line-height: 1.9;
  color: rgba(255,255,255,0.15);
  transition: color 0.4s, opacity 0.4s;
  display: inline;
}
.sub-chunk.active { color: #fff; font-weight: 500; }
.sub-chunk.spoken { color: rgba(255,255,255,0.35); }
.sub-highlight { color: #00c9a7; font-weight: 600; }

/* Waveform visualizer */
.waveform {
  position: absolute;
  bottom: 85px;
  left: 28px;
  right: 28px;
  height: 30px;
  display: flex;
  align-items: center;
  gap: 2px;
}
.wave-bar {
  flex: 1;
  background: linear-gradient(180deg, #007bff, #00c9a7);
  border-radius: 2px;
  height: 4px;
  transition: height 0.1s;
  opacity: 0.5;
}

/* Controls */
.vid-controls { position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 25px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); display: flex; align-items: center; gap: 10px; z-index: 20; }
.ctrl-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(255,255,255,0.1); color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.ctrl-btn:hover { background: rgba(255,255,255,0.2); }
.ctrl-btn.play-btn { width: 50px; height: 50px; background: #007bff; font-size: 20px; }
.ctrl-btn.play-btn:hover { background: #0066dd; }
.ctrl-time { font-size: 12px; color: #888; flex: 1; text-align: right; }
.speed-btn { padding: 4px 10px; border-radius: 12px; border: 1px solid #444; background: transparent; color: #aaa; font-size: 11px; cursor: pointer; }
.speed-btn:hover, .speed-btn.active { border-color: #007bff; color: #007bff; }
.vol-slider { width: 60px; accent-color: #007bff; }

/* Nav arrows */
.nav-hint { position: absolute; top: 50%; transform: translateY(-50%); font-size: 30px; color: rgba(255,255,255,0.1); cursor: pointer; transition: color 0.2s; z-index: 5; user-select: none; }
.nav-hint:hover { color: rgba(255,255,255,0.4); }
.nav-hint.left { left: 15px; }
.nav-hint.right { right: 15px; }

@media (max-width: 800px) {
  .sidebar { display: none; }
  .phone { width: 100%; height: 100vh; border-radius: 0; border: none; }
}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <a href="index.html" class="back-link">&larr; Back to Flashcards</a>
    <div class="sidebar-header">
      <h2>Video Reels</h2>
      <p>17 narrated concept explainers</p>
    </div>
    <div id="sidebarList"></div>
  </div>

  <div class="viewer">
    <div class="nav-hint left" onclick="prevReel()">&#10094;</div>
    <div class="nav-hint right" onclick="nextReel()">&#10095;</div>

    <div class="phone">
      <div class="vid-progress"><div class="vid-progress-fill" id="progressFill"></div></div>

      <div class="screen" id="screen">
        <canvas id="drawCanvas" width="344" height="180"></canvas>
        <div class="vid-section" id="vidSection"></div>
        <div class="vid-title" id="vidTitle"></div>
        <div class="subtitle-area" id="subtitleArea"></div>
        <div class="waveform" id="waveform"></div>
      </div>

      <div class="vid-controls">
        <button class="ctrl-btn" onclick="prevReel()">&#9664;&#9664;</button>
        <button class="ctrl-btn play-btn" id="playBtn" onclick="togglePlay()">&#9654;</button>
        <button class="ctrl-btn" onclick="nextReel()">&#9654;&#9654;</button>
        <button class="speed-btn" id="speedBtn" onclick="cycleSpeed()">1x</button>
        <input type="range" class="vol-slider" id="volSlider" min="0" max="1" step="0.1" value="1" oninput="setVolume(this.value)">
        <span class="ctrl-time" id="timeDisplay">0:00 / 0:00</span>
      </div>
    </div>
  </div>
</div>

<script>
let reels = [], audioManifest = [];
let current = 0, playing = false, speed = 1;
let audio = new Audio();
let animFrame = null;

/* ===== LOAD DATA ===== */
async function init() {
  const [reelsResp, audioResp] = await Promise.all([
    fetch('reels_data.json'),
    fetch('audio_manifest.json')
  ]);
  const reelsJson = await reelsResp.json();
  const audioJson = await audioResp.json();
  reels = reelsJson.reels;
  audioManifest = audioJson.audios;

  // Build waveform bars
  const wf = document.getElementById('waveform');
  wf.innerHTML = Array.from({length: 40}, () => '<div class="wave-bar"></div>').join('');

  buildSidebar();
  loadReel(0);
}

/* ===== SIDEBAR ===== */
function buildSidebar() {
  document.getElementById('sidebarList').innerHTML = reels.map((r, i) => `
    <div class="sidebar-item" data-index="${i}" style="--c: ${r.color}" onclick="goToReel(${i})">
      <div class="si-num">${i + 1}</div>
      <div class="si-text">
        <div class="si-section" style="color: ${r.color}">${r.section}</div>
        <div class="si-title">${r.title}</div>
        <div class="si-playing">&#9654; Playing...</div>
      </div>
    </div>
  `).join('');
  updateSidebar();
}

function updateSidebar() {
  document.querySelectorAll('.sidebar-item').forEach(el => {
    const i = parseInt(el.dataset.index);
    el.classList.toggle('active', i === current);
    el.classList.toggle('playing', i === current && playing);
  });
  const active = document.querySelector('.sidebar-item.active');
  if (active) active.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* ===== DRAWING ENGINE ===== */
const canvas = document.getElementById('drawCanvas');
const ctx = canvas.getContext('2d');

const drawFns = {
  'acc-1': p => { // Income Statement waterfall
    ctx.clearRect(0,0,344,180);
    const items = [
      {l:'Revenue',v:1500,c:'#00c9a7'}, {l:'COGS',v:-150,c:'#ff6b6b'},
      {l:'OpEx',v:-250,c:'#ff6b6b'}, {l:'D&A',v:-60,c:'#ff8c00'},
      {l:'Tax',v:-413,c:'#ff4545'}, {l:'Net Inc',v:627,c:'#007bff'}
    ];
    let x = 15;
    items.forEach((item, i) => {
      const ap = Math.max(0, Math.min((p - i*0.12)*3, 1));
      if (ap <= 0) return;
      const h = Math.abs(item.v) / 20 * ap;
      const y = item.v > 0 ? 150 - h : 150;
      ctx.fillStyle = item.c + '88';
      ctx.fillRect(x, y, 45, h);
      ctx.fillStyle = item.c;
      ctx.font = '10px Segoe UI';
      ctx.globalAlpha = ap;
      ctx.fillText(item.l, x, 170);
      ctx.globalAlpha = 1;
      x += 55;
    });
  },
  'acc-2': p => { // Balance Sheet
    ctx.clearRect(0,0,344,180);
    const lw = 140*p;
    ctx.fillStyle='#007bff22'; ctx.fillRect(20,15,lw,150);
    if(p>0.1){ctx.fillStyle='#007bff';ctx.font='bold 13px Segoe UI';ctx.globalAlpha=Math.min((p-0.1)*3,1);ctx.fillText('ASSETS',55,45);ctx.globalAlpha=1;}
    if(p>0.3){ctx.fillStyle='#aab';ctx.font='11px Segoe UI';ctx.globalAlpha=Math.min((p-0.3)*3,1);['Cash','AR','PP&E','Goodwill'].forEach((t,i)=>ctx.fillText(t,35,70+i*22));ctx.globalAlpha=1;}
    if(p>0.5){ctx.fillStyle='#fff';ctx.font='bold 22px Segoe UI';ctx.globalAlpha=(p-0.5)*2;ctx.fillText('=',165,95);ctx.globalAlpha=1;}
    if(p>0.5){const rw=140*Math.min((p-0.5)*2,1);ctx.fillStyle='#ff454522';ctx.fillRect(185,15,rw,75);ctx.fillStyle='#00c9a722';ctx.fillRect(185,90,rw,75);}
    if(p>0.65){ctx.fillStyle='#ff4545';ctx.font='bold 12px Segoe UI';ctx.globalAlpha=Math.min((p-0.65)*4,1);ctx.fillText('LIABILITIES',198,50);ctx.globalAlpha=1;}
    if(p>0.75){ctx.fillStyle='#00c9a7';ctx.font='bold 12px Segoe UI';ctx.globalAlpha=Math.min((p-0.75)*4,1);ctx.fillText('EQUITY',210,125);ctx.globalAlpha=1;}
  },
  'acc-3': p => { // Cash Flow 3 sections
    ctx.clearRect(0,0,344,180);
    [{l:'CFO',c:'#007bff',y:10},{l:'CFI',c:'#ff8c00',y:65},{l:'CFF',c:'#a855f7',y:120}].forEach((s,i)=>{
      const sp=Math.max(0,Math.min((p-i*0.2)*2.5,1));
      if(sp<=0)return;
      ctx.fillStyle=s.c+'22';ctx.fillRect(20,s.y,304*sp,45);ctx.strokeStyle=s.c+'44';ctx.lineWidth=1;ctx.strokeRect(20,s.y,304*sp,45);
      ctx.fillStyle=s.c;ctx.font='bold 14px Segoe UI';ctx.globalAlpha=sp;ctx.fillText(s.l,30,s.y+28);ctx.globalAlpha=1;
    });
    if(p>0.7){ctx.strokeStyle='#00c9a7';ctx.lineWidth=2;ctx.globalAlpha=(p-0.7)*3;
      [55,110].forEach(y=>{ctx.beginPath();ctx.moveTo(172,y);ctx.lineTo(172,y+10);ctx.lineTo(168,y+6);ctx.moveTo(172,y+10);ctx.lineTo(176,y+6);ctx.stroke();});
      ctx.globalAlpha=1;}
  },
  'acc-4': p => { // 3 linked boxes
    ctx.clearRect(0,0,344,180);
    const boxes=[{l:'Income\nStatement',c:'#007bff',x:20},{l:'Cash Flow\nStatement',c:'#00c9a7',x:130},{l:'Balance\nSheet',c:'#ff8c00',x:240}];
    boxes.forEach((b,i)=>{
      const bp=Math.max(0,Math.min((p-i*0.15)*2.5,1));
      if(bp<=0)return;
      ctx.fillStyle=b.c+'22';ctx.fillRect(b.x,40,90*bp,80);ctx.strokeStyle=b.c;ctx.lineWidth=2;ctx.strokeRect(b.x,40,90*bp,80);
      ctx.fillStyle='#fff';ctx.font='bold 11px Segoe UI';ctx.globalAlpha=bp;
      b.l.split('\n').forEach((line,li)=>ctx.fillText(line,b.x+8,70+li*15));
      ctx.globalAlpha=1;
    });
    if(p>0.5){ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.globalAlpha=Math.min((p-0.5)*3,1);
      ctx.beginPath();ctx.moveTo(110,80);ctx.lineTo(130,80);ctx.stroke();
      ctx.beginPath();ctx.moveTo(220,80);ctx.lineTo(240,80);ctx.stroke();
      ctx.globalAlpha=1;}
    if(p>0.8){ctx.font='10px Segoe UI';ctx.fillStyle='#888';ctx.globalAlpha=(p-0.8)*5;
      ctx.fillText('Net Income',105,135);ctx.fillText('Cash changes',210,135);
      ctx.globalAlpha=1;}
  },
  'acc-5': p => { // Change flow arrows
    ctx.clearRect(0,0,344,180);
    const steps=[{l:'Depr +$10',c:'#ff8c00',y:15},{l:'IS: NI -$6',c:'#ff4545',y:55},{l:'CFS: +$4',c:'#00c9a7',y:95},{l:'BS: Balanced',c:'#007bff',y:135}];
    steps.forEach((s,i)=>{
      const sp=Math.max(0,Math.min((p-i*0.2)*3,1));
      if(sp<=0)return;
      ctx.fillStyle=s.c+'33';ctx.fillRect(50,s.y,244*sp,30);
      ctx.fillStyle=s.c;ctx.font='bold 13px Segoe UI';ctx.globalAlpha=sp;ctx.fillText(s.l,60,s.y+20);ctx.globalAlpha=1;
      if(i>0&&sp>0.5){ctx.strokeStyle='#ffffff33';ctx.beginPath();ctx.moveTo(172,s.y-10);ctx.lineTo(172,s.y);ctx.stroke();}
    });
  },
  'default': p => {
    ctx.clearRect(0,0,344,180);
    for(let i=0;i<12;i++){
      const ip=Math.max(0,Math.min((p-i/24)*3,1));
      if(ip<=0)continue;
      const cx=40+(i%4)*90, cy=40+Math.floor(i/4)*55;
      ctx.beginPath();ctx.arc(cx,cy,12*ip,0,Math.PI*2);
      ctx.fillStyle=`hsl(${200+i*15},70%,60%)`;ctx.globalAlpha=ip*0.5;ctx.fill();ctx.globalAlpha=1;
    }
  }
};
// Map IDs to draw functions
const getDraw = id => drawFns[id] || drawFns['default'];

/* ===== SUBTITLE ENGINE ===== */
function buildSubtitles(script) {
  // Split into sentences/chunks for subtitle display
  const sentences = script.match(/[^.!?]+[.!?]+/g) || [script];
  return sentences.map(s => s.trim()).filter(s => s.length > 0);
}

function renderSubtitles(chunks) {
  const area = document.getElementById('subtitleArea');
  area.innerHTML = chunks.map((chunk, i) =>
    `<span class="sub-chunk" data-chunk="${i}">${chunk} </span>`
  ).join('');
}

function updateSubtitleHighlight(progress, chunks) {
  // Estimate which chunk should be active based on audio progress
  const chunkIndex = Math.floor(progress * chunks.length);
  document.querySelectorAll('.sub-chunk').forEach(el => {
    const i = parseInt(el.dataset.chunk);
    el.classList.remove('active', 'spoken');
    if (i < chunkIndex) el.classList.add('spoken');
    if (i === chunkIndex) {
      el.classList.add('active');
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  });
}

/* ===== WAVEFORM VISUALIZER ===== */
function updateWaveform() {
  const bars = document.querySelectorAll('.wave-bar');
  bars.forEach(bar => {
    const h = playing ? 4 + Math.random() * 22 : 4;
    bar.style.height = h + 'px';
    bar.style.opacity = playing ? 0.5 + Math.random() * 0.3 : 0.2;
  });
}

/* ===== AUDIO PLAYBACK ===== */
function loadReel(index) {
  current = index;
  const reel = reels[current];
  const manifest = audioManifest.find(a => a.id === reel.id);

  document.getElementById('vidSection').textContent = reel.section;
  document.getElementById('vidSection').style.color = reel.color;
  document.getElementById('vidTitle').textContent = reel.title;

  // Load audio
  audio.pause();
  audio.src = manifest ? manifest.file : '';
  audio.playbackRate = speed;
  audio.load();

  // Build subtitles from script
  const script = manifest ? manifest.script : reel.content;
  const chunks = buildSubtitles(script);
  renderSubtitles(chunks);

  // Draw static preview
  getDraw(reel.id)(1);

  // Reset progress
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('timeDisplay').textContent = '0:00 / 0:00';

  updateSidebar();

  // Audio time update
  audio.ontimeupdate = () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    document.getElementById('progressFill').style.width = pct + '%';

    const cur = formatTime(audio.currentTime);
    const tot = formatTime(audio.duration);
    document.getElementById('timeDisplay').textContent = `${cur} / ${tot}`;

    // Update subtitles
    updateSubtitleHighlight(audio.currentTime / audio.duration, chunks);

    // Update drawing
    getDraw(reel.id)(audio.currentTime / audio.duration);

    // Waveform
    updateWaveform();
  };

  audio.onended = () => {
    playing = false;
    document.getElementById('playBtn').innerHTML = '&#9654;';
    updateSidebar();
    // Auto-next after 1.5s
    setTimeout(() => {
      if (current < reels.length - 1) goToReel(current + 1, true);
    }, 1500);
  };
}

function togglePlay() {
  if (playing) {
    audio.pause();
    playing = false;
    document.getElementById('playBtn').innerHTML = '&#9654;';
  } else {
    audio.playbackRate = speed;
    audio.play().catch(e => console.log('Play blocked:', e));
    playing = true;
    document.getElementById('playBtn').innerHTML = '&#9646;&#9646;';
  }
  updateSidebar();
}

function goToReel(i, autoplay = false) {
  playing = false;
  audio.pause();
  current = i;
  loadReel(i);
  if (autoplay) {
    setTimeout(() => togglePlay(), 300);
  }
}

function nextReel() { goToReel((current + 1) % reels.length); }
function prevReel() { goToReel((current - 1 + reels.length) % reels.length); }

function cycleSpeed() {
  const speeds = [0.75, 1, 1.25, 1.5, 2];
  speed = speeds[(speeds.indexOf(speed) + 1) % speeds.length];
  audio.playbackRate = speed;
  document.getElementById('speedBtn').textContent = speed + 'x';
}

function setVolume(v) { audio.volume = parseFloat(v); }

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

/* ===== KEYBOARD ===== */
document.addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); nextReel(); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prevReel(); }
});

/* ===== Waveform idle animation ===== */
setInterval(updateWaveform, 100);

init();
</script>
</body>
</html>
